<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <div id="loginPage">
        <div id="loginForm">
            <h2>Login</h2>
            <div>
                <input type="text" id="teamName" placeholder="Enter Team Name">
                <input type="password" id="password" placeholder="Enter Password">
                <button onclick="teamLogin()">Login as Team</button>
            </div>
            <hr>
            <div>
                <input type="text" id="hostname" placeholder="Enter Host Name">
                <input type="password" id="hostPassword" placeholder="Enter Host Password">
                <button onclick="hostLogin()">Login as Host</button>
            </div>
        </div>
    </div>
</body>
</html>
